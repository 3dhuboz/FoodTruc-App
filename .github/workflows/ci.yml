name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc currently has pre-existing errors that pre-date this CI; gate on
      # the strict Vite build instead so PRs can't regress the build target.
      # Once the existing TS errors are fixed, switch this to a hard gate.
      - name: Type-check (informational)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
